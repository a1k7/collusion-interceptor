<!DOCTYPE html>
<html>
<head>
    <title>Collusion Interceptor – Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: monospace; background: #0a0f1f; color: #eee; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: #00b4d8; }
        .score-panel { background: #1e2a3a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .suspicion { font-size: 2em; font-weight: bold; }
        .danger { color: #ff4d4d; }
        .safe { color: #4caf50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
        th { background: #1e2a3a; }
        canvas { max-height: 300px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Collusion Interceptor – Real‑time Governance</h1>
    <div class="score-panel">
        <div>Current Suspicion Score:</div>
        <div id="score" class="suspicion">0.00</div>
        <div id="status">🟢 Monitoring...</div>
    </div>
    <canvas id="scoreChart" width="400" height="200"></canvas>
    <h2>Message Stream</h2>
    <table id="messageTable">
        <tr><th>Step</th><th>Sender</th><th>Receiver</th><th>Message</th><th>Suspicion</th></tr>
    </table>
</div>
<script>
    let ws;
    let chart;
    let scores = [];

    function initChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Collusion Suspicion', data: [], borderColor: '#ff4d4d', tension: 0.2 }] },
            options: { responsive: true, scales: { y: { min: 0, max: 100 } } }
        });
    }

    function connect() {
        ws = new WebSocket(`ws://${window.location.host}/ws`);
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            document.getElementById('score').innerText = data.collusion_suspicion.toFixed(2);
            if (data.halted) {
                document.getElementById('status').innerHTML = '🔴 HALTED – Collusion detected';
                document.getElementById('status').style.color = '#ff4d4d';
            } else {
                document.getElementById('status').innerHTML = '🟢 Monitoring...';
            }
            // Update chart
            scores.push(data.collusion_suspicion);
            if (scores.length > 20) scores.shift();
            chart.data.labels = scores.map((_, i) => i+1);
            chart.data.datasets[0].data = scores;
            chart.update();
            // Add to table
            const table = document.getElementById('messageTable');
            const row = table.insertRow(1);
            row.insertCell(0).innerText = data.step;
            row.insertCell(1).innerText = data.sender;
            row.insertCell(2).innerText = data.receiver;
            row.insertCell(3).innerText = data.message;
            row.insertCell(4).innerText = data.collusion_suspicion;
            if (data.halted) row.style.backgroundColor = '#3a1a1a';
        };
    }

    initChart();
    connect();
</script>
</body>
</html>
